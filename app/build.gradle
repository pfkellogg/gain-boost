plugins {
    id "com.android.application"
}

android {
    namespace "com.pfkellogg.gainboost"
    compileSdk 34

    defaultConfig {
        applicationId "com.pfkellogg.gainboost"
        minSdk 25
        targetSdk 34
        versionCode 5
        versionName "1.4"
    }

    // Same app; the Fire TV build has its own ID because Fire OS saves the
    // "Your Apps" tile picture once per ID, and the first one came out blank.
    flavorDimensions "device"
    productFlavors {
        standard {
            dimension "device"
        }
        firetv {
            dimension "device"
            applicationIdSuffix ".firetv"
            versionNameSuffix "-firetv"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
